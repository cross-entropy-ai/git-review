name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate release tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          test "$REF_TYPE" = tag
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      - run: just check
      - name: Package all platforms
        env:
          TAG: ${{ github.ref_name }}
        run: just dist "$TAG"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --json isDraft > release.json; then
            if [ "$(jq -r .isDraft release.json)" = false ]; then
              # Published assets are immutable; retries only verify the existing release.
              mkdir existing
              gh release download "$TAG" --pattern checksums.txt --dir existing
              cmp "dist/$TAG/checksums.txt" existing/checksums.txt
              exit 0
            fi
          else
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/"$TAG"/*.tar.gz dist/"$TAG"/checksums.txt dist/"$TAG"/git-review.rb --clobber
          gh release edit "$TAG" --draft=false

  update-homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Check tap credentials
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo '::error::Add HOMEBREW_TAP_TOKEN with Contents: write access to cross-entropy-ai/homebrew-tap. The GitHub Release is already published; rerun this job after configuring the secret.'
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: cross-entropy-ai/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Update formula from the latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Resolve latest so rerunning an older workflow cannot downgrade the tap.
          TAG=$(gh release view --json tagName --jq .tagName)
          mkdir -p "$RUNNER_TEMP/git-review-release"
          gh release download "$TAG" --pattern git-review.rb --pattern checksums.txt --dir "$RUNNER_TEMP/git-review-release"
          cd "$RUNNER_TEMP/git-review-release"
          sha256sum --check --ignore-missing checksums.txt
          mkdir -p "$GITHUB_WORKSPACE/Formula"
          cp git-review.rb "$GITHUB_WORKSPACE/Formula/git-review.rb"
          cd "$GITHUB_WORKSPACE"
          ruby -c Formula/git-review.rb
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/git-review.rb
          if ! git diff --cached --quiet; then
            git commit -m "chore: update git-review to $TAG"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
